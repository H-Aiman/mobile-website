        .slider {
  width: 100%;
  max-width: 800px; /* Adjust slider width as needed */
  margin: auto;
  overflow: hidden; /* Hides the images outside the frame */
}

.slides {
  display: flex;
  width: 300%; /* 100% multiplied by the number of images */
  animation: slide-animation 9s infinite; /* 3 seconds per image */
}

.slides img {
  width: 100%; /* Each image occupies exactly one slider width */
  object-fit: cover;
}

/* Keyframes for 3 images shifting left */
@keyframes slide-animation {
  0% { margin-left: 0%; }
  25% { margin-left: 0%; }     /* Hold Slide 1 */
  33% { margin-left: -100%; }  /* Move to Slide 2 */
  58% { margin-left: -100%; }  /* Hold Slide 2 */
  66% { margin-left: -200%; }  /* Move to Slide 3 */
  91% { margin-left: -200%; }  /* Hold Slide 3 */
  100% { margin-left: 0%; }    /* Loop back to Slide 1 */
}
      
 * {

        /* Responsive Grid System */
        .phone-grid {
            display: grid;

        .phone-card {

        .phone-card:hover {

            align-items: center;
            justify-content: center;
        }

        .item-price {

            color: #0e3054;
            font-weight: bold;
